<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><base href="/web/">
<title>XuperTV</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">XUPER<b>TV</b></div>
    <button class="nav-item is-on" data-view="home">Inicio</button>
    <button class="nav-item" data-view="series">Series</button>
    <button class="nav-item" data-view="movies">Pel&iacute;culas</button>
    <button class="nav-item" data-view="anime">Anime</button>
    <button class="nav-item" data-view="search">Buscar</button>
    <button class="nav-item" data-view="history">Historial</button>
  </nav>
  <main class="main">
    <div class="topbar">
      <div id="page-title" class="title">Inicio</div>
      <button id="btn-reload" class="ghost">Actualizar</button>
    </div>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="searchbar" class="searchbar" hidden>
  <input id="search-input" type="text" placeholder="Buscar serie o pel&iacute;cula" autocomplete="off">
  <button id="btn-search-cancel" class="ghost">Cancelar</button>
</div>
<div id="toast" class="toast"></div>
<div id="overlay" class="overlay" hidden>
  <div class="overlay-box">
    <div class="overlay-title"></div>
    <div class="overlay-body"></div>
    <div class="overlay-actions"></div>
  </div>
</div>
<script src="xuper.js"></script>
</body>
</html>
